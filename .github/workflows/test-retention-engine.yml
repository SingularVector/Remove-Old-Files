name: Test retention engine

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test:
        runs-on: windows-latest
        steps:
            -   uses: actions/checkout@v4
            -   name: Install pinned test framework
                shell: pwsh
                run: Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -SkipPublisherCheck
            -   name: Check source style
                shell: pwsh
                run: ./tools/Test-SourceStyle.ps1
            -   name: Run retention tests
                shell: pwsh
                run: |
                    Import-Module Pester -RequiredVersion 5.7.1
                    $result = Invoke-Pester -Path ./tests -Output Detailed -PassThru
                    if ($result.FailedCount -gt 0 -or $result.Result -ne 'Passed')
                    {
                        exit 1
                    }
